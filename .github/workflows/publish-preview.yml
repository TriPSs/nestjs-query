name: Publish Preview

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup
        uses: ./.github/actions/setup-step

      - name: Build
        run: yarn isox run-many --target=build

      - name: Publish Preview
        run: npx pkg-pr-new publish './dist/packages/*'
