name: Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        default: prod
        type: choice
        options:
          - prod
          - alpha

      releaseAs:
        description: Release as (Required if env = alpha)
        required: false
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache node modules
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            **/node_modules
          key: ${{ env.DEPENDENCIES_CACHE }}-${{ hashFiles('yarn.lock') }}

      - name: yarn install
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install

      - name: GIT/NPM config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Version
        if: ${{ inputs.environment == 'prod' }}
        run: yarn isox run workspace:version

      - name: Version (Alpha)
        if: ${{ inputs.environment == 'alpha' }}
        run: yarn isox run workspace:version --releaseAs=${{inputs.releaseAs}} --preid=alpha

      - name: Build
        run: yarn isox run-many --target=build

      - name: Publish
        if: ${{ inputs.environment == 'prod' }}
        run: yarn isox run-many --target=publish

      - name: Publish (Alpha)
        if: ${{ inputs.environment == 'alpha' }}
        run: yarn isox run-many --target=publish --config=alpha

      - name: Push GIT
        run: git push --follow-tags
